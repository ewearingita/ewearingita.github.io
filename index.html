ng:6px 11px;font-size:13px;color:var(--ink)}.sz.on{background:#fff;border-color:var(--ink);font-weight:700}main{padding:14px 12px 40px;max-width:1100px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);color:inherit;text-decoration:none;display:block}.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center}.ph img{width:100%;height:100%;object-fit:contain}.info{padding:9px 10px 11px;border-top:1px solid var(--line)}.ser{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:.3px}.nmw{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:4px}.pr{font-size:16px;font-weight:800;margin-top:5px}.tg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tg span{font-size:12px;border:1px solid var(--ink);border-radius:6px;padding:2px 7px;font-weight:600}.hero{background:radial-gradient(circle at 100% 100%,transparent 58px,rgba(255,255,255,.95) 59px 62px,transparent 63px),linear-gradient(90deg,transparent calc(100% - 4px),rgba(255,255,255,.95) 0),linear-gradient(0deg,rgba(255,255,255,.95) 4px,transparent 4px),repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(45deg,#2d8c3c 0 34px,#38a447 34px 68px);color:#fff;border-radius:18px;padding:22px 18px;margin-bottom:14px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.22));pointer-events:none;z-index:1}.hero>*{position:relative;z-index:2}.hero .k{font-size:12px;letter-spacing:3px;color:var(--lime);font-weight:700}.hero h2{margin:6px 0 4px;font-size:30px;letter-spacing:3px}.hero p{margin:0;color:#d6e6dc;font-size:14px;line-height:1.4}.stats{display:flex;gap:
